<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#060E1A"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14" stroke="#0D7377" stroke-width="1.5" fill="none"/>
  <!-- Mid ring dashed -->
  <circle cx="16" cy="16" r="9" stroke="#0AAFA3" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2.8" fill="#14FFEC"/>
  <!-- Scan line (12 o'clock) -->
  <line x1="16" y1="16" x2="16" y2="3" stroke="#14FFEC" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Detection blip -->
  <circle cx="22" cy="9" r="1.8" fill="#14FFEC" opacity="0.8"/>
</svg>
