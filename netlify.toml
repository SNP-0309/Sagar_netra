[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — send all routes to index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Proxy /api calls to the Express backend (avoids CORS in browser)
[[redirects]]
  from   = "/api/*"
  to     = "https://your-express-api.onrender.com/api/:splat"
  status = 200
  force  = true

[dev]
  command   = "npm run dev"
  port      = 5173
  targetPort = 5173
