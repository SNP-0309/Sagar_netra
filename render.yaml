services:
  # ── 1. React / Vite Frontend (Static Site) ──────────────────────────────
  - type: web
    name: sagarnetra-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: /api

  # ── 2. Express API Gateway (Node.js) ────────────────────────────────────
  - type: web
    name: sagarnetra-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ML_SERVICE_URL
        fromService:
          name: sagarnetra-ml
          type: web
          property: host
      - key: ML_API_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          name: sagarnetra-client
          type: web
          property: host

  # ── 3. Python FastAPI ML Service ─────────────────────────────────────────
  - type: web
    name: sagarnetra-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ML_API_KEY
        fromService:
          name: sagarnetra-api
          type: web
          envVarKey: ML_API_KEY
