services:
  # ── 1. Python FastAPI ML Service ─────────────────────────────────────────
  - type: web
    name: sagarnetra-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ML_API_KEY
        generateValue: true

  # ── 2. Express API Gateway (Node.js) ────────────────────────────────────
  - type: web
    name: sagarnetra-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_API_URL
        fromService:
          name: sagarnetra-ml
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ML_API_KEY
        fromService:
          name: sagarnetra-ml
          type: web
          envVarKey: ML_API_KEY
      - key: CLIENT_ORIGIN
        sync: false
