services:
  # ── 1. Express API Gateway (Node.js) ────────────────────────────────────
  - type: web
    name: sagarnetra-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ML_SERVICE_URL
        fromService:
          name: sagarnetra-ml
          type: web
          property: host
      - key: ML_API_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://your-app.netlify.app

  # ── 2. Python FastAPI ML Service ─────────────────────────────────────────
  - type: web
    name: sagarnetra-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ML_API_KEY
        fromService:
          name: sagarnetra-api
          type: web
          envVarKey: ML_API_KEY
