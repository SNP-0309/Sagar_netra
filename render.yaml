services:
  # ── 1. Python FastAPI ML Service ─────────────────────────────────────────
  - type: web
    name: sagarnetra-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ML_API_KEY
        sync: false

  # ── 2. Express API Gateway (Node.js) ────────────────────────────────────
  - type: web
    name: sagarnetra-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_API_URL
        sync: false
      - key: ML_API_KEY
        sync: false
      - key: CLIENT_ORIGIN
        value: https://sagar-netra-client-6hab.vercel.app
